<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseForge Workout Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mesh" aria-hidden="true"></div>

    <main class="app-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Workout Studio</p>
                <h1>Build and run interval workouts that stay in flow.</h1>
                <p class="lead">Create exercises, nest them in repeatable groups, then launch a full-screen runner with countdown, pause, and skip.</p>
            </div>
            <div class="hero-actions">
                <button id="importBtn" class="btn btn-ghost" type="button">Import JSON</button>
                <button id="exportBtn" class="btn btn-ghost" type="button">Export JSON</button>
                <input id="importInput" type="file" accept="application/json,.json" hidden>
            </div>
        </header>

        <section class="builder card" aria-label="Workout builder">
            <div class="builder-top">
                <label class="field">
                    <span>Workout Name</span>
                    <input id="workoutName" type="text" maxlength="80" placeholder="Evening Conditioning">
                </label>
                <label class="field countdown-field">
                    <span>Start Countdown (sec)</span>
                    <input id="countdownInput" type="number" min="0" max="30" step="1">
                </label>
            </div>

            <div class="action-row">
                <button id="addExerciseBtn" class="btn btn-primary" type="button">Add Exercise</button>
                <button id="addRestBtn" class="btn btn-secondary" type="button">Add Rest</button>
                <button id="addGroupBtn" class="btn btn-secondary" type="button">Add Group</button>
                <button id="clearWorkoutBtn" class="btn btn-danger" type="button">Clear</button>
                <button id="startWorkoutBtn" class="btn btn-accent" type="button">Start Workout</button>
            </div>

            <div id="planSummary" class="summary"></div>
            <div id="stepsContainer" class="steps" aria-live="polite"></div>
        </section>
    </main>

    <section id="runnerOverlay" class="runner-overlay" aria-label="Workout runner" aria-hidden="true">
        <div class="runner-noise" aria-hidden="true"></div>
        <div class="runner-content">
            <p id="runnerStage" class="runner-stage">Get Ready</p>
            <h2 id="runnerExerciseName" class="runner-exercise">Exercise</h2>
            <p id="runnerExerciseMeta" class="runner-meta">Interval 1 of 1</p>
            <p id="runnerTimer" class="runner-timer">00:00</p>

            <div class="progress-stack">
                <div class="progress-head">
                    <span>Current Step</span>
                    <span id="stepProgressText">00:00 / 00:00</span>
                </div>
                <div class="progress-track">
                    <div id="stepProgressBar" class="progress-fill"></div>
                </div>

                <div class="progress-head">
                    <span>Total Workout</span>
                    <span id="totalProgressText">00:00 / 00:00</span>
                </div>
                <div class="progress-track total-track">
                    <div id="totalProgressBar" class="progress-fill"></div>
                </div>
            </div>

            <div class="runner-actions">
                <button id="pauseResumeBtn" class="btn btn-primary" type="button">Pause</button>
                <button id="skipBtn" class="btn btn-secondary" type="button">Skip</button>
                <button id="stopBtn" class="btn btn-danger" type="button">Stop</button>
            </div>
        </div>
    </section>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
</body>
</html>
